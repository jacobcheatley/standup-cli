[project]
name = "standup-cli"
version = "0.1.0"
description = "Morning standup report: your PRs, issues, pipelines and reminders in one terminal view"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.27.2",
    "rich>=15.0",
    "httpx>=0.28.1",
    "mcp>=1.30,<2",
    "tomli-w>=1.2",
]

[project.urls]
Repository = "https://github.com/jacobcheatley/standup-cli"

[project.scripts]
standup = "standup.cli:app"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "standup"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16.7", "mypy>=2.3.1"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
